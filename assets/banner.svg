<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <!-- Dynamic / Animated Background Wave Elements (Background Layer) -->
  <g opacity="0.25">
    <path d="M 0,150 Q 300,90 600,150 T 1200,150 L 1200,300 L 0,300 Z" fill="#4f46e5">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M 0,150 Q 300,90 600,150 T 1200,150 L 1200,300 L 0,300 Z;
                M 0,150 Q 300,210 600,150 T 1200,150 L 1200,300 L 0,300 Z;
                M 0,150 Q 300,90 600,150 T 1200,150 L 1200,300 L 0,300 Z"/>
    </path>
    <path d="M 0,180 Q 300,240 600,180 T 1200,180 L 1200,300 L 0,300 Z" fill="#0284c7">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M 0,180 Q 300,240 600,180 T 1200,180 L 1200,300 L 0,300 Z;
                M 0,180 Q 300,120 600,180 T 1200,180 L 1200,300 L 0,300 Z;
                M 0,180 Q 300,240 600,180 T 1200,180 L 1200,300 L 0,300 Z"/>
    </path>
  </g>

  <!-- Floating Tech Graphic Elements -->
  <g stroke="url(#glow)" stroke-width="1.5" fill="none" opacity="0.4">
    <circle cx="150" cy="80" r="40">
      <animate attributeName="r" values="35;45;35" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="220" r="50">
      <animate attributeName="r" values="45;55;45" dur="6s" repeatCount="indefinite"/>
    </circle>
    <line x1="100" y1="220" x2="250" y2="220" stroke-dasharray="6,6"/>
    <line x1="950" y1="80" x2="1100" y2="80" stroke-dasharray="6,6"/>
  </g>

  <!-- Foreground Container & Text (Clear & Unobscured) -->
  <g filter="url(#shadow)">
    <!-- Icon / Badge Accent -->
    <rect x="540" y="35" width="120" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="600" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">AWESOME LIST</text>

    <!-- Main Title -->
    <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      Cloud Desktop &amp; Thin Client Hardware Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Centralized Fleet Management • Cloud Gateway • Remote Troubleshooting • Open-Source Tools
    </text>

    <!-- Visual Pills / Tags in Foreground below Subtitle -->
    <g transform="translate(300, 210)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🖥️ Endpoint Management</text>

      <!-- Pill 2 -->
      <rect x="210" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="300" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">☁️ Cloud Gateway VDI</text>

      <!-- Pill 3 -->
      <rect x="420" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="510" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔓 Open-Source Tools</text>
    </g>
  </g>
</svg>
